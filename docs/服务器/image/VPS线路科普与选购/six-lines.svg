  <rect class="f-clay" x="480" y="480" width="660" height="150" rx="24"/>
  <text class="t-l b" x="810" y="546" text-anchor="middle">CMIN2</text>
  <text class="t-name" x="810" y="596" text-anchor="middle">AS58807</text>
  <rect class="f-light" x="1180" y="480" width="660" height="150" rx="24"/>
  <text class="t-l b" x="1510" y="546" text-anchor="middle">CMI</text>
  <text class="t-name" x="1510" y="596" text-anchor="middle">AS58453</text>

  <rect class="f-tan" x="120" y="660" width="300" height="150" rx="24"/>
