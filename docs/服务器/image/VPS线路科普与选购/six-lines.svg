  <rect class="f-clay" x="480" y="300" width="660" height="150" rx="24"/>
  <text class="t-l b" x="810" y="366" text-anchor="middle">CN2</text>
  <text class="t-name" x="810" y="416" text-anchor="middle">AS4809</text>
  <rect class="f-light" x="1180" y="300" width="660" height="150" rx="24"/>
