  <text class="t-tag" x="810" y="262" text-anchor="middle">高端线路</text>
  <text class="t-tag" x="1510" y="262" text-anchor="middle">普通线路</text>

  <rect class="f-tan" x="120" y="300" width="300" height="150" rx="24"/>
