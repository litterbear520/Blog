<svg viewBox="0 0 1920 760" xmlns="http://www.w3.org/2000/svg">
  <!-- 高端 VPS 走高端跨国线路，低端 VPS 走普通跨国线路：延迟 150 vs 330 毫秒 -->
  <defs>
    <marker id="head" viewBox="0 0 28 24" refX="0" refY="12" markerWidth="28" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L28,12 L0,24 Z"/></marker>
    <marker id="head-faint" viewBox="0 0 21 15" refX="0" refY="7.5" markerWidth="21" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-faint" d="M0,0 L21,7.5 L0,15 Z"/></marker>
    <marker id="head-gray" viewBox="0 0 26 20" refX="0" refY="10" markerWidth="26" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-gray" d="M0,0 L26,10 L0,20 Z"/></marker>
  </defs>
  <rect class="bg" width="1920" height="760"/>

  <text class="t-tag" x="80" y="150">高端 VPS</text>
  <rect class="f-tan" x="80" y="200" width="300" height="130" rx="16"/>
  <text class="t-name" x="230" y="279.8" text-anchor="middle">我（国内）</text>
  <text class="t-cap" x="926" y="160" text-anchor="middle">用的人少，相当于高速公路</text>
  <rect class="tag" x="816" y="180" width="220" height="85"/>
  <text class="t-tag" x="926" y="235.8" text-anchor="middle">高端线路</text>
  <line class="line" x1="388" y1="265" x2="1464" y2="265" marker-end="url(#head)"/>
  <text class="t-cap" x="926" y="308" text-anchor="middle">总延迟 150 毫秒</text>
  <rect class="actor" x="1500" y="200" width="340" height="130" rx="16"/>
  <text class="t-name" x="1670" y="279.8" text-anchor="middle">美国 VPS</text>

  <text class="t-tag" x="80" y="490">低端 VPS</text>
  <rect class="f-tan" x="80" y="540" width="300" height="130" rx="16"/>
  <text class="t-name" x="230" y="619.8" text-anchor="middle">我（国内）</text>
  <text class="t-cap" x="926" y="500" text-anchor="middle">用的人多，相当于国道</text>
  <rect class="tag" x="816" y="520" width="220" height="85"/>
  <text class="t-tag" x="926" y="575.8" text-anchor="middle">普通线路</text>
  <line class="gray" x1="388" y1="605" x2="1466" y2="605" marker-end="url(#head-gray)"/>
  <text class="t-cap" x="926" y="648" text-anchor="middle">总延迟 330 毫秒</text>
  <rect class="actor" x="1500" y="540" width="340" height="130" rx="16"/>
  <text class="t-name" x="1670" y="619.8" text-anchor="middle">美国 VPS</text>
</svg>
