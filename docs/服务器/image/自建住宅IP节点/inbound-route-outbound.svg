<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- 3x-ui 的入站、路由规则、出站：国内流量从入站进来，经路由规则交给出站，发往住宅 IP -->
  <defs>
    <marker id="head" viewBox="0 0 28 24" refX="0" refY="12" markerWidth="28" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L28,12 L0,24 Z"/></marker>
    <marker id="head-gray" viewBox="0 0 26 20" refX="0" refY="10" markerWidth="26" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-gray" d="M0,0 L26,10 L0,20 Z"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1080"/>

  <rect class="actor" x="60" y="370" width="200" height="130" rx="16"/>
  <text class="t-name" x="160" y="449.8" text-anchor="middle">手机</text>

  <!-- 第一跳：VLESS + Reality 过墙 -->
  <text class="t-cap" x="427" y="330" text-anchor="middle">伪装过墙</text>
  <rect class="tag" x="352" y="350" width="150" height="85"/>
  <text class="t-tag" x="427" y="405.8" text-anchor="middle">VLESS</text>
  <line class="line" x1="268" y1="435" x2="559" y2="435" marker-end="url(#head)"/>
  <line class="faint dash" x1="525" y1="290" x2="525" y2="580"/>
  <text class="t-label" x="525" y="620" text-anchor="middle">GFW</text>

  <!-- 中转 VPS 里的 3x-ui -->
  <rect class="container" x="555" y="210" width="860" height="400" rx="56"/>
  <text class="t-xl" x="985" y="298" text-anchor="middle">中转 VPS 上的 3x-ui</text>
  <rect class="f-tan" x="595" y="380" width="220" height="110" rx="40"/>
  <text class="t-name" x="705" y="449.8" text-anchor="middle">入站</text>
  <line class="gray" x1="823" y1="435" x2="841" y2="435" marker-end="url(#head-gray)"/>
  <rect class="f-tan" x="875" y="380" width="220" height="110" rx="40"/>
  <text class="t-name" x="985" y="449.8" text-anchor="middle">路由规则</text>
  <line class="gray" x1="1103" y1="435" x2="1121" y2="435" marker-end="url(#head-gray)"/>
  <rect class="f-tan" x="1155" y="380" width="220" height="110" rx="40"/>
  <text class="t-name" x="1265" y="449.8" text-anchor="middle">出站</text>
  <text class="t-cap" x="705" y="540" text-anchor="middle">接收国内流量</text>
  <text class="t-cap" x="985" y="540" text-anchor="middle">入站标签 → 出站标签</text>
  <text class="t-cap" x="1265" y="540" text-anchor="middle">发往住宅 IP</text>

  <!-- 第二跳：用住宅 IP 的账号密码连接 -->
  <text class="t-cap" x="1540" y="330" text-anchor="middle">住宅 IP 的账号密码</text>
  <rect class="tag" x="1430" y="350" width="190" height="85"/>
  <text class="t-tag" x="1525" y="405.8" text-anchor="middle">SOCKS5</text>
  <line class="line" x1="1383" y1="435" x2="1624" y2="435" marker-end="url(#head)"/>
  <rect class="ring" x="1660" y="370" width="200" height="130" rx="18"/>
  <text class="t-name" x="1760" y="449.8" text-anchor="middle">住宅 IP</text>

  <rect class="f-clay" x="460" y="710" width="1000" height="170" rx="40"/>
  <text class="t-name b" x="960" y="785" text-anchor="middle">路由规则把入站和出站连成一条链</text>
  <text class="t-name" x="960" y="834.5" text-anchor="middle">中转节点收到的流量，全部转发到住宅 IP</text>
</svg>
