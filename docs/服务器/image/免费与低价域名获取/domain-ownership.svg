<svg viewBox="0 0 1920 620" xmlns="http://www.w3.org/2000/svg">
  <!-- 免费三级域名挂在厂商的二级域名下，二级域名过期就作废；付费一级域名归自己 -->
  <defs>
    <!-- 箭头的底边对齐线的终点：线画到“箭头尖 − 箭头长”（head 28、head-faint 21、head-gray 26、head-fat 36） -->
    <marker id="head" viewBox="0 0 28 24" refX="0" refY="12" markerWidth="28" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L28,12 L0,24 Z"/></marker>
    <marker id="head-faint" viewBox="0 0 21 15" refX="0" refY="7.5" markerWidth="21" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-faint" d="M0,0 L21,7.5 L0,15 Z"/></marker>
    <marker id="head-gray" viewBox="0 0 26 20" refX="0" refY="10" markerWidth="26" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-gray" d="M0,0 L26,10 L0,20 Z"/></marker>
    <marker id="head-fat" viewBox="0 0 36 56" refX="0" refY="28" markerWidth="36" markerHeight="56" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fat" d="M0,0 L36,28 L0,56 Z"/></marker>
  </defs>
  <rect class="bg" width="1920" height="620"/>

  <!-- 左：免费域名挂在厂商的二级域名下 -->
  <text class="t-tag" x="80" y="110">免费域名</text>
  <rect class="container" x="80" y="150" width="820" height="410" rx="56"/>
  <text class="t-xl" x="490" y="238" text-anchor="middle">de5.net</text>
  <text class="t-cap" x="490" y="285" text-anchor="middle">DNSHE 买的二级域名，过期就一起作废</text>
  <rect class="f-tan" x="160" y="330" width="660" height="180" rx="40"/>
  <text class="t-name" x="490" y="410" text-anchor="middle">inficheesy.de5.net</text>
  <text class="t-cap" x="490" y="459" text-anchor="middle">我注册的三级域名</text>
  
  <!-- 右：付费域名自己拥有 -->
  <text class="t-tag" x="1020" y="110">付费域名</text>
  <rect class="f-tan" x="1100" y="265" width="660" height="180" rx="40"/>
  <text class="t-name" x="1430" y="345" text-anchor="middle">inficheesylink.top</text>
  <text class="t-cap" x="1430" y="394" text-anchor="middle">我买的一级域名，所有权在自己手里</text>
</svg>
