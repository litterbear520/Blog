name: Build HTML
on: push

# 同一分支连续 push 时取消上一次还没跑完的构建，避免两次部署并行抢 gh-pages
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chinese fonts for browser verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - name: Verify real walkthrough pages on desktop and mobile
        run: |
          if ! node tools/walkthrough-browser.mjs; then
            # Preserve the static site for reproducing a browser failure offline.
            cp -a build test-results/repro-site
            exit 1
          fi
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
      - name: Verify deployed walkthrough pages
        if: github.ref == 'refs/heads/main'
        env:
          WALKTHROUGH_BASE_URL: https://huangsitao.fun
          WALKTHROUGH_WAIT_SECONDS: 300
        run: node tools/walkthrough-browser.mjs
      - name: Save walkthrough browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
