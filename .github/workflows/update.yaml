name: Build HTML
on: push

# 同一分支连续 push 时取消上一次还没跑完的构建，避免两次部署并行抢 gh-pages
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify real walkthrough pages on desktop and mobile
        run: node tools/walkthrough-browser.mjs
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
      - name: Verify deployed walkthrough pages
        if: github.ref == 'refs/heads/main'
        env:
          WALKTHROUGH_BASE_URL: https://huangsitao.fun
          WALKTHROUGH_WAIT_SECONDS: 300
        run: node tools/walkthrough-browser.mjs
      - name: Save walkthrough browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-browser-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
