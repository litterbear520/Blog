name: Build HTML
on: push

jobs:
  build:
    # 固定 24.04：ubuntu-latest 从 2026-10-19 起会切到 Ubuntu 26.04，
    # 下面的 Chromium 测试对系统和字体敏感，换镜像要单独开一次改动验证后再升
    runs-on: ubuntu-24.04
    # 浏览器步骤偶尔会卡住，别让它占满默认的 6 小时
    timeout-minutes: 25
    # 同一分支连续 push 时取消上一次还没跑完的构建
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      # 只改文章、图片时演练页不受影响，后面的浏览器步骤都跳过
      - name: Decide whether browser checks are needed
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci-scope.mjs

      - name: Run unit tests
        run: npm run test:code-viewer-unit && npm run test:focus-range && npm run test:message-flow && npm run test:diagrams && npm run test:quick-check && npm run test:term && npm run test:ci-scope && npm run test:covers && npm run test:plugins && npm run test:data-module

      - uses: ./.github/actions/setup-browser
        if: steps.scope.outputs.browser != 'false'

      # 真实 Chromium 偶尔起不来（首条 CDP 命令无应答），重试两次再判失败；
      # 真实回归会连着三次都挂，不会被重试掩盖。
      - name: Run project viewer layout tests
        if: steps.scope.outputs.browser != 'false'
        run: |
          for attempt in 1 2 3; do
            if npm run test:code-viewer-layout; then exit 0; fi
            echo "::warning title=浏览器测试重试::第 ${attempt} 次失败，重试"
            sleep 5
          done
          exit 1

      # 测试上面已经单独跑过，这里跳过 prebuild 不再重复
      - name: Build site
        run: npm run build --ignore-scripts

      # 线上版本的标记：部署后靠它确认新版本到了，下次 push 靠它算改动范围
      - name: Write revision marker
        run: printf '{"revision":"%s"}' "$GITHUB_SHA" > build/walkthrough-revision.json

      - name: Verify real walkthrough pages on desktop and mobile
        if: steps.scope.outputs.browser != 'false'
        run: |
          if ! node tools/walkthrough-browser.mjs; then
            # Preserve the static site for reproducing a browser failure offline.
            mkdir -p test-results
            cp -a build test-results/repro-site
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: build

      - name: Save walkthrough browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 部署排队，不取消已经开始的部署；排队中的旧部署会被新的顶替
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    # 部署权限只给这个 job，npm ci 和构建都碰不到
    permissions:
      contents: read
      pages: write
      id-token: write
      # 部署卡住重试时要列出这次运行的产物
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 偶尔卡在 syncing_files 不动：正常部署十几秒完成，卡住的等多久都不会好。
      # 3 分钟没完成就放弃，下一步换个版本号重新部署同一份产物（重跑同一次部署会复用提交号，照样卡住）
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 180000
          # 临时：让第一次部署必然失败，验证下面的重试能把站点部署上去。验证完删掉这一行
          artifact_name: retry-path-test

      - name: Retry a stuck Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: context.runId, name: 'github-pages' });
            if (!artifacts.length) return core.setFailed('找不到这次构建的 github-pages 产物');
            const done = ['succeed'];
            const dead = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_attempt_error'];
            for (let attempt = 1; attempt <= 3; attempt++) {
              const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner, repo,
                artifact_id: artifacts[0].id,
                pages_build_version: `${context.sha}-retry-${context.runAttempt}-${attempt}`,
                oidc_token: await core.getIDToken(),
              });
              core.info(`第 ${attempt} 次重新部署：${deployment.id}`);
              let status = '';
              for (const until = Date.now() + 180000; Date.now() < until;) {
                await new Promise((r) => setTimeout(r, 5000));
                ({ data: { status } } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id: deployment.id }));
                core.info(`状态：${status}`);
                if (done.includes(status) || dead.includes(status)) break;
              }
              if (done.includes(status)) return core.info('部署完成');
              if (!dead.includes(status)) {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id: deployment.id }).catch(() => {});
              }
            }
            core.setFailed('重新部署了 3 次都没完成');

      - name: Confirm the new revision is live
        if: needs.build.outputs.browser == 'false'
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 15 "https://huangsitao.fun/walkthrough-revision.json?verify=$RANDOM" | grep -q "$GITHUB_SHA"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::新版本 5 分钟内没有出现在线上"
          exit 1

      - uses: actions/checkout@v7
        if: needs.build.outputs.browser != 'false'
      - uses: actions/setup-node@v7
        if: needs.build.outputs.browser != 'false'
        with:
          node-version: 24
      - uses: ./.github/actions/setup-browser
        if: needs.build.outputs.browser != 'false'

      - name: Smoke test deployed walkthrough pages
        if: needs.build.outputs.browser != 'false'
        env:
          WALKTHROUGH_BASE_URL: https://huangsitao.fun
          WALKTHROUGH_WAIT_SECONDS: 300
          WALKTHROUGH_SMOKE: '1'
        run: node tools/walkthrough-browser.mjs

      - name: Save live browser screenshots and results
        if: always() && needs.build.outputs.browser != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
