<svg viewBox="0 0 768 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scene-template-title scene-template-desc">
  <title id="scene-template-title">选项 1：整个目录放进上下文</title>
  <desc id="scene-template-desc">这张图说明第一个选项：顾客在对话里问有没有 200 美元以内的双人帐篷，Agent 打算先把整个商品目录读一遍再挑。</desc>
  <defs>
    <marker id="scene-template-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="mk" d="M1,1 L9,5 L1,9"/></marker>
  </defs>

  <!-- 左：对话窗口。标题条是只圆上角的 path，盖在窗口描边里面 -->
  <rect class="s-window" x="40" y="40" width="320" height="280" rx="12"/>
  <path class="s-bar" d="M40.5,72 V52 Q40.5,40.5 52,40.5 H348 Q359.5,40.5 359.5,52 V72 Z"/>
  <line class="divider" x1="40" y1="72" x2="360" y2="72"/>
  <text class="t-who" x="56" y="61">对话</text>

  <rect class="s-bubble-user" x="136" y="88" width="208" height="68" rx="10"/>
  <text class="t-who" x="152" y="110">顾客</text>
  <text class="t-msg" x="152" y="130">有没有 200 美元以内的</text>
  <text class="t-msg" x="152" y="148">双人帐篷？</text>

  <rect class="s-bubble-agent" x="56" y="172" width="232" height="68" rx="10"/>
  <text class="t-who" x="72" y="194">Agent</text>
  <text class="t-msg" x="72" y="214">我先把整个目录读一遍，</text>
  <text class="t-msg" x="72" y="232">再挑出合适的。</text>

  <rect class="s-card" x="56" y="264" width="288" height="36" rx="8"/>
  <text class="t-note" x="72" y="287">输入消息…</text>

  <!-- 右：商品目录。第六张卡淡化，表示目录远不止这几件 -->
  <rect class="s-window" x="440" y="40" width="288" height="280" rx="12"/>
  <path class="s-bar" d="M440.5,72 V52 Q440.5,40.5 452,40.5 H716 Q727.5,40.5 727.5,52 V72 Z"/>
  <line class="divider" x1="440" y1="72" x2="728" y2="72"/>
  <text class="t-who" x="456" y="61">商品目录</text>

  <rect class="s-card" x="456" y="88" width="120" height="56" rx="8"/>
  <rect class="s-thumb" x="464" y="96" width="40" height="40" rx="4"/>
  <text class="t-sub" x="516" y="120">帐篷</text>
  <rect class="s-card" x="592" y="88" width="120" height="56" rx="8"/>
  <rect class="s-thumb" x="600" y="96" width="40" height="40" rx="4"/>
  <text class="t-sub" x="652" y="120">炉子</text>
  <rect class="s-card" x="456" y="160" width="120" height="56" rx="8"/>
  <rect class="s-thumb" x="464" y="168" width="40" height="40" rx="4"/>
  <text class="t-sub" x="516" y="192">睡袋</text>
  <rect class="s-card" x="592" y="160" width="120" height="56" rx="8"/>
  <rect class="s-thumb" x="600" y="168" width="40" height="40" rx="4"/>
  <text class="t-sub" x="652" y="192">睡垫</text>
  <rect class="s-card" x="456" y="232" width="120" height="56" rx="8"/>
  <rect class="s-thumb" x="464" y="240" width="40" height="40" rx="4"/>
  <text class="t-sub" x="516" y="264">杯子</text>
  <rect class="s-card s-dim" x="592" y="232" width="120" height="56" rx="8"/>
  <text class="t-sub" x="652" y="264" text-anchor="middle">还有很多…</text>

  <!-- 连线用普通箭头；全图唯一的强调是底部的选项标签（选项对照图的焦点就是它） -->
  <path class="arrow" d="M288,206 C344,206 380,180 432,180" marker-end="url(#scene-template-arrow)"/>
  <rect class="n-focal" x="184" y="352" width="400" height="40" rx="8"/>
  <text class="t-name" x="384" y="378" text-anchor="middle">选项 1：整个目录放进上下文</text>
</svg>
